    FollowPath.ax_min: -1.0
    FollowPath.ay_max: 0.0
    FollowPath.ay_min: -3.0
    FollowPath.az_max: 2.0
    FollowPath.batch_size: 1000
    FollowPath.critics:
    - ConstraintCritic
    - CostCritic
    - GoalCritic
    - GoalAngleCritic
    - PathAlignCritic
    - PathFollowCritic
    - PathAngleCritic
    - PreferForwardCritic
    FollowPath.enforce_path_inversion: false
    FollowPath.gamma: 0.015
    FollowPath.iteration_count: 1
    FollowPath.max_robot_pose_search_dist: 1.5
