    FollowPath.GoalCritic.cost_weight: 5.0
    FollowPath.GoalCritic.enabled: true
    FollowPath.GoalCritic.threshold_to_consider: 1.399999976158142
    FollowPath.PathAlignCritic.cost_power: 1
