    FollowPath.plugin: nav2_mppi_controller::MPPIController
    FollowPath.prune_distance: 1.7
    FollowPath.regenerate_noises: false
    FollowPath.retry_attempt_limit: 1
    FollowPath.temperature: 0.3
    FollowPath.time_steps: 50
    FollowPath.transform_tolerance: 0.1
    FollowPath.visualize: false
    FollowPath.vx_max: 0.3
    FollowPath.vx_min: -0.1
    FollowPath.vx_std: 0.15
    FollowPath.vy_max: 0.0
    FollowPath.vy_std: 0.15
    FollowPath.wz_max: 1.0
    FollowPath.wz_std: 0.35
    action_server_result_timeout: 10.0
    autostart_node: false
    bond_heartbeat_period: 0.1
    controller_frequency: 20.0
    controller_plugins:
    - FollowPath
    controller_server.verbose: false
    costmap_update_timeout: 0.3
    enable_stamped_cmd_vel: false
    failure_tolerance: 0.3
    general_goal_checker.plugin: nav2_controller::SimpleGoalChecker
    general_goal_checker.stateful: true
    general_goal_checker.symmetric_yaw_tolerance: false
    general_goal_checker.xy_goal_tolerance: 0.25
    general_goal_checker.yaw_goal_tolerance: 0.25
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    odom_topic: odom
    progress_checker.movement_time_allowance: 10.0
    progress_checker.plugin: nav2_controller::SimpleProgressChecker
    progress_checker.required_movement_radius: 0.5
    progress_checker_plugins:
    - progress_checker
    publish_zero_velocity: true
    qos_overrides./clock.subscription.depth: 1
    qos_overrides./clock.subscription.durability: volatile
    qos_overrides./clock.subscription.history: keep_last
    qos_overrides./clock.subscription.reliability: best_effort
    speed_limit_topic: speed_limit
    start_type_description_service: true
    use_realtime_priority: false
    use_sim_time: true
