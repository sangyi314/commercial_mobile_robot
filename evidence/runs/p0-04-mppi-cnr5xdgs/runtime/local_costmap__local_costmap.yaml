local_costmap/local_costmap:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    always_send_full_costmap: true
    autostart_node: false
    bond_heartbeat_period: 0.1
    filters: []
    footprint: '[]'
    footprint_padding: 0.009999999776482582
    global_frame: odom
    height: 3
    inflation_layer.cost_scaling_factor: 3.0
    inflation_layer.enabled: true
    inflation_layer.inflate_around_unknown: false
    inflation_layer.inflate_unknown: false
    inflation_layer.inflation_radius: 0.7
    inflation_layer.plugin: nav2_costmap_2d::InflationLayer
    initial_transform_timeout: 60.0
    lethal_cost_threshold: 100
    map_topic: /map
    map_vis_z: 0.0
    observation_sources: ''
    origin_x: 0.0
    origin_y: 0.0
    plugins:
    - voxel_layer
    - inflation_layer
    publish_frequency: 2.0
    qos_overrides./clock.subscription.depth: 1
    qos_overrides./clock.subscription.durability: volatile
    qos_overrides./clock.subscription.history: keep_last
    qos_overrides./clock.subscription.reliability: best_effort
    resolution: 0.05
    robot_base_frame: base_link
    robot_radius: 0.22
    rolling_window: true
    start_type_description_service: true
    track_unknown_space: false
    transform_tolerance: 0.3
    trinary_costmap: true
    unknown_cost_value: 255
    update_frequency: 5.0
    use_maximum: false
    use_sim_time: true
    voxel_layer.combination_method: 1
    voxel_layer.enabled: true
    voxel_layer.footprint_clearing_enabled: true
    voxel_layer.mark_threshold: 0
    voxel_layer.max_obstacle_height: 2.0
