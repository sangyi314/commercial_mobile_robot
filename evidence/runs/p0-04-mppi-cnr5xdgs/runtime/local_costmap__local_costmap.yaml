    voxel_layer.observation_sources: scan
    voxel_layer.origin_z: 0.0
    voxel_layer.plugin: nav2_costmap_2d::VoxelLayer
    voxel_layer.publish_voxel_map: true
    voxel_layer.scan.clearing: true
    voxel_layer.scan.data_type: LaserScan
    voxel_layer.scan.expected_update_rate: 0.0
    voxel_layer.scan.inf_is_valid: false
    voxel_layer.scan.marking: true
    voxel_layer.scan.max_obstacle_height: 2.0
    voxel_layer.scan.min_obstacle_height: 0.0
    voxel_layer.scan.observation_persistence: 0.0
    voxel_layer.scan.obstacle_max_range: 2.5
    voxel_layer.scan.obstacle_min_range: 0.0
    voxel_layer.scan.raytrace_max_range: 3.0
    voxel_layer.scan.raytrace_min_range: 0.0
    voxel_layer.scan.sensor_frame: ''
    voxel_layer.scan.topic: /scan
    voxel_layer.unknown_threshold: 15
    voxel_layer.z_resolution: 0.05
    voxel_layer.z_voxels: 16
    width: 3
